name: Optional validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check web/app.js && node --check web/core.js
      - run: node --test tests/web_core.test.cjs
      - run: python -m unittest discover -s tests -v
      - name: Check deployment assets
        run: diff -r --exclude=.nojekyll web docs
